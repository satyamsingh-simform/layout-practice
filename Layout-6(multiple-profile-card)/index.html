<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple-profile-card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <main>
        <section class="sec-left">
            <div class="left-div-top">
                <div class="img-left"></div>
                <div class="text-left">
                    <div class="text">
                        <p class="p-1"></p>
                        <p class="p-2"></p>
                    </div>
                    <div class="round">
                        <p >hgfds</p>
                    </div>
                </div>
            </div>
            <div class="left-div-mid">
                <div class="mid-div-1 "></div>
                <div class="mid-div-2 "></div>
                <div class="mid-div-3 "></div>
                <div class="mid-div-4 "></div>
            </div>
            <div class="left-div-btm">
                <div class="btm-div"></div>
            </div>
        </section>

        <section class="sec-mid">
            <div class="mid-div-top">
                <div class="mid-text">
                    <p class="text-1"></p>
                    <p class="text-2"></p>
                </div>
                <div class="mid-profile">
                    <p class="profile"></p>
                </div>
            </div>
            <div class="mid-div-btm">
                <div class="mid-div-box"></div>
            </div>
        </section>

        <section class="sec-right">
            <div class="right-div-top">
                <div class="h-line">
                    <p class="h-para"></p>
                </div>
                <div class="right-box"></div>
                <div class="right-text">
                    <p class="right-p-1"></p>
                    <p class="right-p-2"></p>
                    <p class="right-p-3"></p>
                </div>
            </div>
            <div class="right-div-btm">
                <div class="btm-left"></div>
                <div class="btm-right">
                    <div class="btm-right-para-1">
                        <p class="last-p-1"></p>
                        <p class="last-p-2"></p>
                        <p class="last-p-3"></p>
                    </div>
                    <div class="btm-right-para-2">
                        <p class="last-p-4"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
